<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="art-title art-desc"><title id="art-title">HTAFL CREATE / Founder note</title><desc id="art-desc">Editable HTAFL artwork. Bracketed copy and empty image frames are template placeholders, not approved posts.</desc><rect x="0" y="0" width="1080" height="1080" rx="0" fill="#3157FF"/><text x="80" y="100" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500" fill="#FFFFFF">CREATE</text><text x="856" y="100" font-family="Space Grotesk, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.03em" fill="#FFFFFF">HTAFL</text><text x="80" y="280" font-family="Space Grotesk, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-0.035em" fill="#FFFFFF">[Approved founder</text><text x="80" y="367.36" font-family="Space Grotesk, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-0.035em" fill="#FFFFFF">note]</text><text x="80" y="490.72" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="400" fill="#FFFFFF">[First brief personal reflection]</text><text x="80" y="569.12" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="400" fill="#FFFFFF">[Second brief personal reflection]</text><text x="80" y="992" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="500" fill="#FFFFFF">[Approved signature / invitation]</text></svg>
