<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="art-title art-desc"><title id="art-title">HTAFL CONNECT / Founder note</title><desc id="art-desc">Editable HTAFL artwork. Bracketed copy and empty image frames are template placeholders, not approved posts.</desc><rect x="0" y="0" width="1200" height="675" rx="0" fill="#F7F3EA"/><path d="M64 104H1136" fill="none" stroke="#3157FF" stroke-width="3"/><text x="64" y="72" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500" fill="#111827">CONNECT</text><text x="992" y="72" font-family="Space Grotesk, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.03em" fill="#111827">HTAFL</text><text x="64" y="198" font-family="Space Grotesk, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-0.035em" fill="#111827">[Approved founder note]</text><text x="64" y="277.2" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#111827">[First brief personal reflection]</text><text x="64" y="328.4" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#111827">[Second brief personal reflection]</text><text x="64" y="587" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500" fill="#111827">[Approved signature / invitation]</text></svg>
