<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="art-title art-desc"><title id="art-title">HTAFL source/reference card</title><desc id="art-desc">Editable HTAFL artwork. Bracketed copy and empty image frames are template placeholders, not approved posts.</desc><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F7F3EA"/><text x="96" y="120" font-family="Space Grotesk, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-0.03em" fill="#111827">HTAFL</text><text x="96" y="240" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500" fill="#111827">SOURCE / REFERENCE</text><text x="96" y="396" font-family="Space Grotesk, Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-0.035em" fill="#111827">[Source / reference title]</text><text x="96" y="640" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="400" fill="#111827">[Author / organization]</text><text x="96" y="712" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="400" fill="#111827">[Publication / date]</text><text x="96" y="784" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="400" fill="#111827">[Verified URL in description]</text><text x="96" y="856" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="400" fill="#111827">[Accessed / checked date]</text></svg>
